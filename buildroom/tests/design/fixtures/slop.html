<!doctype html>
<html>
<head><title>Acme</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root { --c-bg: #f5efe3; --c-ink: #8a8a8a; --c-accent: #7c3aed; --c-accent-ink: #ffffff; }
body { background: var(--c-bg); color: var(--c-ink); font: 15px/1.5 Inter, sans-serif; }
h1 { font-family: "Instrument Serif", serif; } h1 em { font-style: italic; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; }
.btn { border-radius: 999px; background: var(--c-accent); color: var(--c-accent-ink); padding: 12px 24px; }
.glow { background: radial-gradient(circle, #8b5cf6, #ec4899); filter: blur(80px); }
.card { padding: 24px; } .fade { animation: up 1s; } @keyframes up { from { opacity: 0 } }
.wide { width: 1200px; }
</style></head>
<body>
<div class="glow"></div>
<section><p class="eyebrow">New</p><h1>Build your future <em>today</em></h1><p>Lorem ipsum dolor sit amet. Join 10,000+ clients and grow 300%.</p><a class="btn" href="#">Get started</a><a class="btn" href="#">Book a demo</a><a class="btn" href="#">Learn more</a></section>
<section><p class="eyebrow">Features</p><h2>Everything you need</h2>
<div class="grid"><div class="card"><h3>🚀 Fast</h3><p>Very fast.</p></div><div class="card"><h3>✨ Easy</h3><p>So easy.</p></div><div class="card"><h3>🔒 Safe</h3><p>Very safe.</p></div></div></section>
<section><p class="eyebrow">Proof</p><h2>Loved by many</h2><p>Trusted by teams at leading companies</p></section>
<img src="img/x.png">
</body></html>
